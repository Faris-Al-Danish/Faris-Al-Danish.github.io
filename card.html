<style>
:root{--bg:#070b16;--ink:#eef2fb;--mute:#9aa6c3;--dim:#6f7c9c;--acc:#22e6ff;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(520px 520px at 50% 0%,rgba(34,230,255,.14),transparent 70%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:calc(36px + env(safe-area-inset-top,0px)) 22px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;line-height:1.5}
.card{width:100%;max-width:420px}
.ph{position:relative;width:176px;height:176px;margin:0 auto}
.ph::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1.5px solid rgba(34,230,255,.4);animation:pu 3.2s ease-in-out infinite}
.ph img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--acc);display:block;background:#f1f1f4}
@keyframes pu{50%{transform:scale(1.06);opacity:.4}}
h1{font-family:Sora,Inter,sans-serif;font-weight:800;font-size:clamp(30px,9vw,38px);letter-spacing:-.03em;line-height:1.1;margin-top:30px}
.role{color:var(--mute);font-size:17px;font-weight:500;margin-top:8px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chips b{font-weight:600;font-size:13px;border-radius:999px;padding:5px 14px;display:inline-flex;align-items:center;gap:7px}
.c1{border:1px solid rgba(34,230,255,.55);color:var(--acc);background:rgba(34,230,255,.08)}
.c2{border:1px solid var(--line);color:#dfe6f6;background:rgba(255,255,255,.04)}
.c2 i{width:8px;height:8px;border-radius:50%;background:#2dff9a}
.acts{display:grid;gap:10px;margin-top:30px}
.b{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);text-decoration:none;font-weight:600;font-size:16.5px;transition:transform .2s,border-color .2s,background .2s}
.b:active{transform:scale(.98)}
.b:hover{border-color:var(--acc)}
.b.p{background:var(--acc);border-color:var(--acc);color:#04101a}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{margin-top:30px;display:grid;gap:14px;padding-top:24px;border-top:1px solid var(--line)}
.info small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.info div{font-size:17px;font-weight:500;word-break:break-word}
.q{width:150px;height:150px;background:#fff;border-radius:20px;padding:12px;margin:30px auto 0}
.q svg{width:100%;height:100%;display:block}
.qc{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-top:10px}
a:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.ph::before{animation:none}}
</style>
</head>
